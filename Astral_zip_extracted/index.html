<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astral — redesigned</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"></script>

    <style>
      :root {
        color-scheme: dark;
        --ink: #fafafa;
        --ink-2: rgba(250, 250, 250, 0.62);
        --ink-3: rgba(250, 250, 250, 0.42);
        --ink-4: rgba(250, 250, 250, 0.22);
        --bg: #08090b;
        --bg-1: #0d0e11;
        --bg-2: #131418;
        --line: rgba(255, 255, 255, 0.07);
        --line-2: rgba(255, 255, 255, 0.12);
        --accent: #818cf8; /* indigo-400 */
        --accent-soft: rgba(129, 140, 248, 0.16);
        --accent-line: rgba(129, 140, 248, 0.4);
        --warm: #f59e0b; /* amber-500 */
        --warm-soft: rgba(245, 158, 11, 0.14);
        --warm-line: rgba(245, 158, 11, 0.38);
        --crit: #f43f5e;
        --crit-soft: rgba(244, 63, 94, 0.14);
        --ok: #34d399;
      }

      /* Light mode (Tweak) */
      html.is-light {
        color-scheme: light;
        --ink: #0b0d12;
        --ink-2: rgba(11, 13, 18, 0.66);
        --ink-3: rgba(11, 13, 18, 0.46);
        --ink-4: rgba(11, 13, 18, 0.22);
        --bg: #f7f7f8;
        --bg-1: #ffffff;
        --bg-2: #fbfbfc;
        --line: rgba(11, 13, 18, 0.08);
        --line-2: rgba(11, 13, 18, 0.14);
        --accent-soft: rgba(99, 102, 241, 0.12);
      }

      html, body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-feature-settings: "ss01", "cv11";
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .font-mono {
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-feature-settings: "ss01";
      }

      /* Surface tokens */
      .surface {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .surface-2 {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .hairline { border-color: var(--line); }
      .hairline-2 { border-color: var(--line-2); }

      .tnum { font-variant-numeric: tabular-nums; }
      .eyebrow {
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* Glow ring used by status pill */
      @keyframes pulseDot {
        0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
        50% { box-shadow: 0 0 0 4px transparent; opacity: 0.65; }
      }
      .live-dot {
        animation: pulseDot 2.4s ease-in-out infinite;
      }

      /* Animated leading-edge dot on history chart */
      @keyframes leadPulse {
        0%, 100% { r: 4; opacity: 1; }
        50% { r: 5.5; opacity: 0.7; }
      }
      .lead-dot { animation: leadPulse 1.8s ease-in-out infinite; transform-box: fill-box; }

      /* Subtle dotted backdrop for history chart */
      .chart-grid {
        background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
        background-size: 18px 18px;
        background-position: 0 0;
      }

      /* Stagger fade-in */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }

      /* Subtle hover lift on cards */
      .card-hover { transition: border-color .2s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
      .card-hover:hover { border-color: var(--line-2); }

      /* Number tick animation when value changes */
      @keyframes tickPulse {
        0% { color: var(--accent); }
        100% { color: var(--ink); }
      }
      .tick-pulse { animation: tickPulse .9s ease-out; }

      /* Scrollbar */
      .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
      .nice-scroll::-webkit-scrollbar-track { background: transparent; }
      .nice-scroll::-webkit-scrollbar-thumb {
        background: var(--line-2);
        border-radius: 999px;
      }

      /* Drawer slide */
      @keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
      .drawer-in { animation: drawerIn .35s cubic-bezier(.2,.8,.2,1) both; }

      /* Backdrop fade */
      @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
      .backdrop-in { animation: backdropIn .25s ease both; }

      /* Toast slide */
      @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
      .toast-in { animation: toastIn .3s cubic-bezier(.2,.8,.2,1) both; }

      /* Skeleton */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, var(--bg-2), var(--line), var(--bg-2));
        background-size: 200% 100%;
        animation: shimmer 1.6s ease-in-out infinite;
        border-radius: 8px;
      }

      /* Focus ring */
      .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent-line); }

      /* Selection */
      ::selection { background: var(--accent-soft); color: var(--ink); }

      /* Remove tap highlight */
      * { -webkit-tap-highlight-color: transparent; }

      /* Buttons */
      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 500;
        padding: 7px 11px; border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg-2); color: var(--ink-2);
        transition: background .15s ease, color .15s ease, border-color .15s ease;
        cursor: default;
      }
      .btn:hover { background: var(--bg-1); color: var(--ink); border-color: var(--line-2); }
      .btn-primary {
        background: var(--accent); color: #0b0d12; border-color: var(--accent);
      }
      .btn-primary:hover { background: var(--accent); color: #0b0d12; opacity: .9; }
      .btn-ghost { background: transparent; border-color: transparent; }
      .btn-ghost:hover { background: var(--bg-2); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="mock-data.js"></script>
    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="screens.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
