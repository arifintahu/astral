name: Bug report
description: Something does not work as the README or docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, webhook URLs or private hostnames. For security problems, use private reporting instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Astral version
      description: Run `astral --version`, or read it from the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run Astral
      options:
        - Release binary
        - Docker
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system of the monitored server
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only if the problem is in the dashboard, for example Firefox 130 or Chrome on Android.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshot
      description: Server output (set `RUST_LOG=debug` for more) or a screenshot of the dashboard. Remove anything private.
      render: text
