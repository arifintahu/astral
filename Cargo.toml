[package]
name = "astral"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.32"
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", features = ["json"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
sysinfo = "0.36.1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.22.0", features = ["v4", "fast-rng"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization (removes dead code)
codegen-units = 1   # Slower compile time, but smaller binary
strip = true        # Automatically strip symbols from the binary
panic = "abort"     # Removes panic unwinding code (reduces size)
